<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ValueTrips · 智能话术工作台</title>
<style>
/* ===== Design System ===== */
:root {
  --nav: #1a2332;
  --bg: #f0f2f5;
  --surf: #ffffff;
  --side: #f5f7f9;
  --bord: #dfe3e8;
  --bord-l: #e9edf0;
  --text: #33475b;
  --txt2: #6b7a8d;
  --txt3: #99a7b8;
  --blue: #0091ae;
  --blue-bg: #e5f5fa;
  --green: #00b86b;
  --red: #e64653;
  --red-bg: #fff5f5;
  --orange: #f5a623;
  --purple: #5c3dd0;
  --shd: 0 1px 3px rgba(0,0,0,.06);
  --shd-md: 0 4px 12px rgba(0,0,0,.07);
  --rad: 8px;
  --rad-lg: 12px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --tr: all .18s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg: #0d1520; --surf: #1a2332; --side: #141d2a; --bord: #2d3a4a; --bord-l: #233040;
  --text: #e8edf2; --txt2: #9aabb8; --txt3: #5c6f82; --blue-bg: #0d2838;
  --red-bg: #2d0a0a; --shd: 0 1px 3px rgba(0,0,0,.2); --shd-md: 0 4px 12px rgba(0,0,0,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--txt3);border-radius:10px}

/* === Shell === */
.shell{display:flex;flex-direction:column;height:100vh;max-width:1440px;margin:0 auto}

/* === Top Nav === */
.top{background:var(--nav);padding:0 24px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top-l{display:flex;align-items:center;gap:10px}
.top-l .logo{font-size:16px;font-weight:800;background:linear-gradient(135deg,#00b8d4,#00e5a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.3px}
.top-l .div{width:1px;height:20px;background:rgba(255,255,255,.15)}
.top-l .sub{font-size:11px;color:rgba(255,255,255,.45);font-weight:500;letter-spacing:.3px;text-transform:uppercase}
.top-r{display:flex;gap:4px}
.nb{background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.65);padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:var(--font);font-weight:500;transition:var(--tr)}
.nb:hover{background:rgba(255,255,255,.14);color:#fff}
.nb.on{background:var(--blue);color:#fff}
.nb .kd{font-size:9px;opacity:.5;background:rgba(255,255,255,.1);padding:0 4px;border-radius:2px;margin-left:2px}

/* === Work === */
.wk{display:flex;flex:1;min-height:0;overflow:hidden}

/* === Side === */
.sd{width:224px;flex-shrink:0;background:var(--side);border-right:1px solid var(--bord);display:flex;flex-direction:column;overflow-y:auto;padding:14px 10px;gap:12px}
.sd h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sd h4 .b{font-size:9px;background:var(--bord);padding:0 6px;border-radius:3px;color:var(--txt3);font-weight:600;text-transform:none;letter-spacing:0}

/* === Persona === */
.pl{display:flex;flex-direction:column;gap:3px}
.pc{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:var(--tr)}
.pc:hover{background:var(--surf);border-color:var(--bord)}
.pc.on{background:var(--blue-bg);border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.pc .e{font-size:15px;width:22px;text-align:center;flex-shrink:0}
.pc .i{flex:1;min-width:0}
.pc .n{font-size:12px;font-weight:600}
.pc .h{font-size:10px;color:var(--txt3);margin-top:1px}
.pc .d{width:8px;height:8px;border-radius:50%;flex-shrink:0;opacity:0;transition:var(--tr)}
.pc.on .d{opacity:1}
.d0{background:#f43f5e}.d1{background:#3b82f6}.d2{background:#8b5cf6}.d3{background:#f59e0b}.d4{background:#10b981}.d5{background:#06b6d4}

/* === Redline === */
.rl{font-size:11px;line-height:1.9}
.rl .r{display:flex;align-items:center;gap:6px;padding:2px 0;color:var(--txt2)}
.rl .r .x{font-size:12px;width:16px;text-align:center}

/* === Notes === */
.nb{margin-top:auto}
.nb textarea{width:100%;background:var(--surf);border:1px solid var(--bord);border-radius:6px;padding:8px;font-size:11px;outline:none;color:var(--text);resize:vertical;min-height:44px;font-family:var(--font);transition:var(--tr)}
.nb textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg)}
.nb .h{font-size:9px;color:var(--txt3);margin-top:3px}

/* === Steps === */
.st{background:var(--surf);border-bottom:1px solid var(--bord);display:flex;flex-shrink:0;overflow-x:auto;padding:0 16px}
.stb{padding:9px 14px;font-size:12px;font-weight:500;cursor:pointer;color:var(--txt3);border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);transition:var(--tr)}
.stb:hover{color:var(--txt2);background:var(--side)}
.stb.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.stb .l{font-size:10px;font-weight:700;background:var(--bord);border-radius:3px;padding:0 5px;line-height:18px;color:var(--txt3);transition:var(--tr)}
.stb.on .l{background:var(--blue-bg);color:var(--blue)}

/* === Content === */
.cx{flex:1;overflow-y:auto;padding:18px 22px;background:var(--bg)}

/* === Card === */
.cd{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad-lg);box-shadow:var(--shd);margin-bottom:10px}
.cd-h{padding:12px 16px 0;display:flex;align-items:center;gap:8px}
.cd-h h3{font-size:13px;font-weight:600}
.cd-b{padding:10px 16px 14px}

/* === Script === */
.sb{background:var(--side);border:1px solid var(--bord-l);border-radius:var(--rad);padding:10px 14px;margin:6px 0;position:relative}
.sb .m{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.sb .t{font-size:13px;line-height:1.8;color:var(--text)}
.sb .n{font-size:10px;color:var(--txt3);margin-top:3px;display:flex;align-items:center;gap:4px}
.cp{position:absolute;top:8px;right:8px;opacity:0;transition:var(--tr);background:var(--surf);border:1px solid var(--bord);border-radius:4px;padding:2px 7px;font-size:10px;cursor:pointer;color:var(--txt3);font-family:var(--font);display:flex;align-items:center;gap:3px}
.sb:hover .cp{opacity:1}
.cp:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.cp.ok{background:var(--green);color:#fff;border-color:var(--green);opacity:1}

/* === Option grid === */
.og{display:flex;flex-direction:column;gap:6px}
.og .sb{margin:0}

/* === Warning badge === */
.wb{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:4px}
.wb.warn{background:#fffbeb;color:#b45309}
.wb.dang{background:#fef2f2;color:#991b1b}
.wb.ok{background:#ecfdf5;color:#065f46}

/* === Obj Table === */
.ow{overflow-x:auto}
.ot{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.ot th{padding:7px 10px;text-align:left;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--txt3);background:var(--side);border-bottom:2px solid var(--bord);position:sticky;top:0}
.ot th:first-child{border-radius:6px 0 0 0}
.ot th:last-child{border-radius:0 6px 0 0}
.ot td{padding:7px 10px;border-bottom:1px solid var(--bord-l);color:var(--text);vertical-align:top}
.ot tr:last-child td{border-bottom:none}
.ot tr:hover td{background:var(--side)}
.ot .cb{background:none;border:none;cursor:pointer;font-size:15px;padding:2px;border-radius:3px;color:var(--txt3);transition:var(--tr)}
.ot .cb:hover{background:var(--blue-bg);color:var(--blue)}

/* === Alert === */
.ar{background:var(--red-bg);border:1px solid #fecaca;border-left:3px solid var(--red);border-radius:var(--rad);padding:10px 14px;margin-top:10px}
.ar .l{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--red);letter-spacing:.4px;margin-bottom:3px}
.ar .b{font-size:12px;color:var(--text);line-height:1.7}

/* === Badge === */
.pbadge{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600}
.pbadge.hm{background:#fff1f2;color:#be123c}.pbadge.fm{background:#eff6ff;color:#1d4ed8}.pbadge.bz{background:#f5f3ff;color:#6d28d9}.pbadge.ex{background:#fffbeb;color:#b45309}.pbadge.yn{background:#ecfdf5;color:#047857}.pbadge.nd{background:#ecfeff;color:#0e7490}

/* === Tip === */
.tp{font-size:11px;color:var(--txt3);padding:4px 0 6px 2px;display:flex;align-items:center;gap:4px}

/* === Empty === */
.em{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:60px 20px}
.em .g{width:80px;height:80px;background:var(--side);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:14px}
.em h2{font-size:16px;color:var(--txt2);font-weight:500}
.em p{font-size:12px;color:var(--txt3);margin-top:4px}

/* === Word Bank === */
.wb-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;margin-top:6px}
.wb-grid .wg{background:var(--side);border:1px solid var(--bord-l);border-radius:4px;padding:6px 8px}
.wb-grid .wg .w{font-weight:600;color:var(--red)}
.wb-grid .wg .r{color:var(--txt2);font-size:10px;margin-top:2px}

/* === Toast === */
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surf);padding:8px 20px;border-radius:6px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;box-shadow:var(--shd-md);white-space:nowrap}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* === RWD === */
@media(max-width:860px){
  .wk{flex-direction:column}
  .sd{width:100%;flex-direction:row;overflow-x:auto;padding:8px 10px;gap:6px;border-right:none;border-bottom:1px solid var(--bord)}
  .sd>div{min-width:200px}
  .pl{flex-direction:row;flex-wrap:wrap}
  .pc{flex:1;min-width:100px}
  .cx{padding:12px 14px}
  .cp{opacity:1}
  .wb-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .top{padding:0 12px}
  .st{padding:0 6px}
  .stb{padding:7px 8px;font-size:11px}
  .cx{padding:8px 10px}
}
</style>
</head>

  </div>
</div>

initSteps();

// ===== CORE =====
function selP(k) { st.p = k; st.tone = 0; render(); }
function goS(s) {
  if (!st.p && s !== 'WB') { toast('请先选择客户人群'); return; }
  st.step = s; render();
}

function toggleMode() {
  st.mode = st.mode === 'training' ? 'live' : 'training';
  const b = document.getElementById('modeBtn');
  if (st.mode === 'training') { b.innerHTML='<span>🎓</span><span class="tx">培训</span><span class="kd">M</span>'; b.classList.add('on'); }
  else { b.innerHTML='<span>⚡</span><span class="tx">实战</span><span class="kd">M</span>'; b.classList.remove('on'); }
  render();
}

function toggleTheme() {
  if (document.body.getAttribute('data-theme')==='dark') {
    document.body.removeAttribute('data-theme');
    document.getElementById('themeBtn').innerHTML='<span>🌙</span><span class="kd">T</span>';
  } else {
    document.body.setAttribute('data-theme','dark');
    document.getElementById('themeBtn').innerHTML='<span>☀️</span><span class="kd">T</span>';
  }
}

// ===== RENDER =====
function render() {
  // Update active states
  document.querySelectorAll('.pc').forEach(el => el.classList.toggle('on', el.dataset.p === st.p));
  document.querySelectorAll('.stb').forEach(el => el.classList.toggle('on', el.dataset.s === st.step));

  const cx = document.getElementById('cx');
  if (!st.p && st.step !== 'WB') {
    cx.innerHTML = `<div class="em"><div class="g">👈</div><h2>选择一个客户人群</h2><p>从左侧选择后将加载对应话术</p></div>`;
    return;
  }

  if (st.step === 'WB') { renderWB(cx); return; }

  const p = D[st.p];
  if (st.step === 'AR') { renderComment(cx, p); return; }

  switch(st.step) {
    case 'A': renderDM(cx, p); break;
    case 'B': renderB(cx, p); break;
    case 'C': renderC(cx, p); break;
    case 'D': renderD(cx, p); break;
    case 'E': renderE(cx, p); break;
    case 'F': renderF(cx, p); break;
  }
}

// ===== HELPERS =====
function sb(text, label, isComment) {
  const warn = isComment ? checkBanned(text) : '';
  return `<div class="sb">
    <div class="m">${label} ${warn}</div>
    <div class="t">${text}</div>
    <button class="cp" data-c="${esc(text)}">📋 复制</button>
  </div>`;
}

function checkBanned(text) {
  const hits = BANNED.comment.filter(w => text.includes(w.word));
  if (hits.length === 0) return '';
  return `<span class="wb dang">🚨 含违禁词：${hits.map(h=>h.word).join('、')}</span>`;
}

      <span style="color:var(--green);">✅ 应该做</span><br>${p.do.map(d=>`&nbsp;&nbsp;• ${d}`).join('<br>')}
    </div>
    <div style="font-size:12px;line-height:2.2;margin-top:4px;">
      <span style="color:var(--red);">❌ 不要做</span><br>${p.dont.map(d=>`&nbsp;&nbsp;• ${d}`).join('<br>')}
    </div>
  </div></div>`;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function bindCopy() {
  document.querySelectorAll('.cp, .cb').forEach(el => {
    el.removeEventListener('click', cpH);
    el.addEventListener('click', cpH);
  });
}
function cpH(e) {
  const el = e.currentTarget;
  let t = el.getAttribute('data-c') || '';
  if (!t) t = el.parentElement.querySelector('.t')?.textContent || '';
  const raw = t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  clip(raw).then(() => {
    el.textContent = '✅'; el.classList.add('ok');
    toast('✅ 已复制');
    setTimeout(() => { el.textContent='📋'; el.classList.remove('ok'); }, 1200);
  });
}
async function clip(t) {
  try { await navigator.clipboard.writeText(t); return; } catch(e) {}
  const ta = document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function toast(m) { const t=document.getElementById('tt'); t.textContent=m; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1800); }

// ===== KEYS =====
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA') return;
  const n='123456'.indexOf(e.key); if(n>=0&&PKEYS[n]){ selP(PKEYS[n]); return; }
  const s='abcdef'.indexOf(e.key.toLowerCase()); if(s>=0){ goS('ABCDEF'[s]); return; }
  if(e.key==='7'){ goS('AR'); return; }
  if(e.key==='8'){ goS('WB'); return; }
  if(e.key.toLowerCase()==='m'){ toggleMode(); return; }
  if(e.key.toLowerCase()==='t'){ toggleTheme(); return; }
});
