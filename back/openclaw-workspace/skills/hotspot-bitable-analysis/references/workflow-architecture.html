<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>热点商机多维分析 — 工作流架构</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f7fa;font-family:PingFang SC,Microsoft YaHei,sans-serif;display:flex;justify-content:center;padding:40px 20px}
svg{max-width:1400px;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
text{font-family:PingFang SC,Microsoft YaHei,sans-serif}
.box{fill:#fff;stroke-width:2;rx:8;ry:8}
.badge{font-size:12px;fill:#666}
.label{font-size:14px;fill:#333;font-weight:500}
.sub{font-size:11px;fill:#888}
.tag{font-size:10px;fill:#fff;rx:3;ry:3}
.arrow{stroke:#999;stroke-width:1.5;fill:none}
.arrow-wide{stroke:#999;stroke-width:2;fill:none;stroke-dasharray:6,4}
.arrow-thin{stroke:#bbb;stroke-width:1;fill:none;stroke-dasharray:3,3}
</style></head><body>
<svg viewBox="0 0 1360 1620" xmlns="http://www.w3.org/2000/svg">

<!-- Title -->
<text x="680" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">热点商机多维分析 — 全链路工作流</text>
<text x="680" y="62" text-anchor="middle" font-size="13" fill="#888">采集 → 分析 → 深度子表 → 笔记裂变 → 持续运营</text>

<!-- ===== Phase 1: 数据采集 ===== -->
<rect x="40" y="90" width="1280" height="260" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="60" y="115" font-size="14" font-weight="600" fill="#4338ca">阶段一：数据采集</text>

<!-- Step 0: 上游产业链 -->
<rect x="60" y="130" width="240" height="90" class="box" stroke="#6366f1"/>
<text x="180" y="155" text-anchor="middle" class="badge" fill="#6366f1">Step 0</text>
<text x="180" y="174" text-anchor="middle" class="label">上游产业链采集</text>
<text x="180" y="194" text-anchor="middle" class="sub">环球旅讯 / 新华网旅游</text>
<rect x="90" y="206" width="180" height="8" class="tag" fill="#a5b4fc"/>

<!-- Step 1: 多平台热搜 -->
<rect x="340" y="130" width="240" height="90" class="box" stroke="#6366f1"/>
<text x="460" y="155" text-anchor="middle" class="badge" fill="#6366f1">Step 1</text>
<text x="460" y="174" text-anchor="middle" class="label">多平台热搜采集</text>
<text x="460" y="194" text-anchor="middle" class="sub">微博/知乎/抖音/头条/B站/36氪</text>
<rect x="380" y="206" width="160" height="8" class="tag" fill="#a5b4fc"/>

<!-- 并行标识 -->
<text x="310" y="176" font-size="20" fill="#6366f1" text-anchor="middle">⇄</text>
<text x="310" y="192" font-size="10" fill="#6366f1" text-anchor="middle">并行</text>

<!-- 采集输出 -->
<rect x="640" y="140" width="160" height="70" rx="8" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="4,2"/>
<text x="720" y="168" text-anchor="middle" class="sub" fill="#4338ca">原始数据</text>
<text x="720" y="185" text-anchor="middle" class="sub" fill="#4338ca">JSON/CSV</text>

<!-- Arrow: 上游→输出 -->
<path d="M300 175 L330 175" class="arrow"/>
<path d="M580 175 L630 175" class="arrow"/>

<!-- 热点→地点转化 -->
<rect x="60" y="248" width="520" height="38" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="320" y="272" text-anchor="middle" font-size="12" fill="#16a34a">📄 热点→地点转化规则（正向/反向分析，拒绝「全国」）</text>
<path d="M180 220 L180 243" class="arrow-wide"/>
<path d="M460 220 L460 243" class="arrow-wide"/>

<!-- Arrow: 输出→阶段二 -->
<path d="M720 210 L720 370" class="arrow" stroke="#6366f1" stroke-width="2.5"/>

<!-- ===== Phase 2: 分析入库 ===== -->
<rect x="40" y="380" width="1280" height="240" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="60" y="405" font-size="14" font-weight="600" fill="#dc2626">阶段二：分析入库</text>

<!-- Step 2 -->
<rect x="60" y="420" width="180" height="80" class="box" stroke="#ef4444"/>
<text x="150" y="443" class="badge" fill="#ef4444">Step 2</text>
<text x="150" y="460" class="label">交叉合并</text>
<text x="150" y="480" class="sub">上游+热搜去重</text>

<!-- Step 3 -->
<rect x="280" y="420" width="180" height="80" class="box" stroke="#ef4444"/>
<text x="370" y="443" class="badge" fill="#ef4444">Step 3</text>
<text x="370" y="460" class="label">商机分析</text>
<text x="370" y="480" class="sub">优先级⭐评定</text>

<!-- Step 4 -->
<rect x="500" y="420" width="200" height="80" class="box" stroke="#ef4444"/>
<text x="600" y="443" class="badge" fill="#ef4444">Step 4</text>
<text x="600" y="460" class="label">创建主Bitable</text>
<text x="600" y="480" class="sub">字段配置+15条商机入库</text>

<!-- 权限标签 -->
<rect x="740" y="420" width="190" height="80" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
<text x="835" y="443" font-size="12" fill="#ea580c" text-anchor="middle">🔐 权限设置</text>
<text x="835" y="462" font-size="10" fill="#9a3412" text-anchor="middle">永乐=管理员(full_access)</text>
<text x="835" y="478" font-size="10" fill="#9a3412" text-anchor="middle">链接=互联网可阅读</text>
<text x="835" y="494" font-size="10" fill="#9a3412" text-anchor="middle">每次创建文件后立即设置</text>

<path d="M150 500 L150 515 L370 515 L370 503" class="arrow"/>
<path d="M460 500 L460 515 L600 515 L600 503" class="arrow"/>
<path d="M700 460 L730 460" class="arrow"/>

<!-- 跨阶段 → 深度分析 -->
<path d="M600 500 L600 540 L680 540 L680 640" class="arrow" stroke="#ef4444" stroke-width="2"/>

<!-- ===== Phase 3: 深度分析子表 ===== -->
<rect x="40" y="650" width="1280" height="230" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
<text x="60" y="675" font-size="14" font-weight="600" fill="#d97706">阶段三：深度分析子表</text>

<!-- Step 5 -->
<rect x="60" y="695" width="240" height="80" class="box" stroke="#f59e0b"/>
<text x="180" y="718" class="badge" fill="#f59e0b">Step 5</text>
<text x="180" y="736" class="label">深度分析子表×N</text>
<text x="180" y="756" class="sub">三亚/成都/上海/贵州/北京/美加墨</text>

<!-- Step 6 -->
<rect x="340" y="695" width="240" height="80" class="box" stroke="#f59e0b"/>
<text x="460" y="718" class="badge" fill="#f59e0b">Step 6</text>
<text x="460" y="736" class="label">酒店资源匹配</text>
<text x="460" y="756" class="sub">每城20家酒店 + 高德地图验证链接</text>

<!-- Step 7 -->
<rect x="620" y="695" width="240" height="80" class="box" stroke="#f59e0b"/>
<text x="740" y="718" class="badge" fill="#f59e0b">Step 7</text>
<text x="740" y="736" class="label">文旅调研</text>
<text x="740" y="756" class="sub">8维度分析（基础/文化/视觉/避坑等）</text>

<path d="M300 735 L335 735" class="arrow"/>
<path d="M580 735 L615 735" class="arrow"/>

<!-- 步调规范 -->
<rect x="900" y="695" width="260" height="80" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
<text x="1030" y="716" font-size="11" fill="#854d0e" text-anchor="middle">⏱ 步调规范</text>
<text x="1030" y="734" font-size="10" fill="#854d0e" text-anchor="middle">关联地点不可写「全国」</text>
<text x="1030" y="750" font-size="10" fill="#854d0e" text-anchor="middle">每家深度子表≥20家酒店</text>
<text x="1030" y="766" font-size="10" fill="#854d0e" text-anchor="middle">酒店附高德/官网验证链接</text>

<!-- Product: 子表产出 -->
<rect x="120" y="793" width="220" height="30" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
<text x="230" y="813" text-anchor="middle" font-size="11" fill="#b45309">产出：深度子表 × 6 = 120+条数据</text>

<!-- Arrow → 笔记 -->
<path d="M680 775 L680 900" class="arrow" stroke="#d97706" stroke-width="2.5"/>

<!-- ===== Phase 4: 笔记裂变 ===== -->
<rect x="40" y="910" width="1280" height="290" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="60" y="935" font-size="14" font-weight="600" fill="#16a34a">阶段四：笔记裂变内容库</text>

<!-- Step 8 -->
<rect x="60" y="955" width="200" height="85" class="box" stroke="#22c55e"/>
<text x="160" y="977" class="badge" fill="#22c55e">Step 8</text>
<text x="160" y="994" class="label">创建裂变内容库</text>
<text x="160" y="1014" class="sub">10模板字段结构</text>

<!-- Step 9 -->
<rect x="300" y="955" width="220" height="85" class="box" stroke="#22c55e"/>
<text x="410" y="977" class="badge" fill="#22c55e">Step 9</text>
<text x="410" y="994" class="label">生成笔记</text>
<text x="410" y="1014" class="sub">10模板/对标克隆模式</text>

<!-- Step 10 -->
<rect x="560" y="955" width="200" height="85" class="box" stroke="#22c55e"/>
<text x="660" y="977" class="badge" fill="#22c55e">Step 10</text>
<text x="660" y="994" class="label">扩展到所有酒店</text>
<text x="660" y="1014" class="sub">每酒店10篇×20家酒店</text>

<path d="M260 998 L295 998" class="arrow"/>
<path d="M520 998 L555 998" class="arrow"/>

<!-- 笔记规则卡片 -->
<rect x="810" y="955" width="320" height="130" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
<text x="970" y="976" font-size="11" fill="#166534" text-anchor="middle">📋 笔记生成规则</text>
<text x="830" y="996" font-size="10" fill="#15803d">• 标题≤20字（含emoji）</text>
<text x="830" y="1012" font-size="10" fill="#15803d">• 正文按目标人群调整文案</text>
<text x="830" y="1028" font-size="10" fill="#15803d">• 目标人群=MultiSelect(20+选项)</text>
<text x="830" y="1044" font-size="10" fill="#15803d">• 配图建议结构化(封面+图2-4+AI prompt)</text>
<text x="830" y="1060" font-size="10" fill="#15803d">• 素材参考链接(Pexels/Unsplash/YouTube)</text>
<text x="830" y="1076" font-size="10" fill="#15803d">• 通过合规校验(xiaohongshu_compliance)</text>

<!-- 产出 -->
<rect x="100" y="1060" width="620" height="30" rx="6" fill="#bbf7d0" stroke="#4ade80" stroke-width="1" stroke-dasharray="3,2"/>
<text x="410" y="1080" text-anchor="middle" font-size="11" fill="#166534">产出：每酒店10篇 × N家酒店 = 笔记内容库 + 配图方案 + 素材搜索链接</text>

<!-- Arrow → 运营 -->
<path d="M680 1200 L680 1260" class="arrow" stroke="#16a34a" stroke-width="2.5"/>

<!-- ===== Phase 5: 持续运营 ===== -->
<rect x="40" y="1270" width="1280" height="190" rx="10" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/>
<text x="60" y="1295" font-size="14" font-weight="600" fill="#a16207">阶段五：持续运营</text>

<!-- Step 11 -->
<rect x="60" y="1310" width="220" height="70" class="box" stroke="#eab308"/>
<text x="170" y="1333" class="badge" fill="#eab308">Step 11</text>
<text x="170" y="1350" class="label">上游数据入子表</text>
<text x="170" y="1370" class="sub">航空/酒店/政策/会展</text>

<!-- Step 12 -->
<rect x="320" y="1310" width="220" height="70" class="box" stroke="#eab308"/>
<text x="430" y="1333" class="badge" fill="#eab308">Step 12</text>
<text x="430" y="1350" class="label">每日混合简报</text>
<text x="430" y="1370" class="sub">上游+热搜+商机交叉</text>

<!-- Step 13 -->
<rect x="580" y="1310" width="220" height="70" class="box" stroke="#eab308"/>
<text x="690" y="1333" class="badge" fill="#eab308">Step 13</text>
<text x="690" y="1350" class="label">输出+更新Skill</text>
<text x="690" y="1370" class="sub">Bitable链接+踩坑记录</text>

<path d="M280 1345 L315 1345" class="arrow"/>
<path d="M540 1345 L575 1345" class="arrow"/>

<!-- 每日产出 -->
<rect x="860" y="1310" width="300" height="70" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
<text x="1010" y="1335" font-size="11" fill="#854d0e" text-anchor="middle">📊 每日自动产出</text>
<text x="1010" y="1355" font-size="10" fill="#854d0e" text-anchor="middle">• 多平台数据采集（09:00定时）</text>
<text x="1010" y="1371" font-size="10" fill="#854d0e" text-anchor="middle">• 完整链路数据产出（按需执行）</text>

<!-- 底部版本 -->
<text x="680" y="1510" text-anchor="middle" font-size="11" fill="#bbb">热点商机多维分析 v2.1 | 更新于 2026-06-08</text>
<text x="680" y="1530" text-anchor="middle" font-size="10" fill="#ccc">数据源：微博/知乎/抖音/头条/B站/贴吧/36氪/环球旅讯 | 输出：Bitable + 每日简报 + 笔记裂变</text>

</svg>
</body></html>
