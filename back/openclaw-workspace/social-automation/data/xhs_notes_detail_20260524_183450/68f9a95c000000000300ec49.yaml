      type: normal
      desc: "好朋友生日，提前绿泡泡预定了老牌杭州西子湖四季酒店·金沙厅，目前杭州唯一一家黑珍珠三钻，共消费2212元，含15%服务费（图2）。\n\t\
        \n5/5 口味：\n来了很多次金沙厅，菜品口味上都没有什么可以挑剔的，品质在线。餐前惯例上了小菜，每人配了一碗虾皮紫菜油条豆浆（图3），豆浆是甜口的，味道很浓厚。\n\
        \U0001F4CC宋嫂鱼羹 \U0001F31F\U0001F31F\U0001F31F\U0001F31F\U0001F31F\n98米，每次来必点，汤底浓稠，鲜香不腥，里面有大块的鳕鱼肉，建议倒一点香醋，口感很绝。\n\
        \U0001F4CC三鲜馄饨老鸡汤 \U0001F31F\U0001F31F\U0001F31F\U0001F31F\n68米，汤色清亮，汤头鲜美，配着三颗小馄饨和菌菇，馄饨品质相对一般。\n\
        \U0001F4CC珊汁芝麻虾 \U0001F31F\U0001F31F\U0001F31F\U0001F31F\U0001F31F\n80米/例，全场最惊喜的一道菜，用的开背老虎虾，用蛋黄酱和芥末酱调味，配着芝麻。虾肉紧实Q弹，一口下去完美。\n\
        \U0001F4CC金沙脆皮鸡 \U0001F31F\U0001F31F\U0001F31F\U0001F31F\n148米，不会出错的一道菜，一定趁热吃！外皮很脆，鸡肉多汁。选取了整只鸡最嫩的部位，还是有几块比较柴。\n\
        \U0001F4CC蠔皇原只十头干鲍 \U0001F31F\U0001F31F\U0001F31F\U0001F31F\n888米，全场最贵的一道菜，干鲍是五年南非鲍，发的不错，溏心口感软糯；是好吃的，但没有被惊艳。\n\
        \U0001F4CC西湖醋鱼 \U0001F31F\U0001F31F\U0001F31F\U0001F31F\U0001F31F\n398米，作为土生土长的杭州人，很爱西湖醋鱼，金沙厅选用的是笋壳鱼，相较于草鱼，肉多刺少，基本没有土腥味，是好吃的。我喜欢鱼肉裹着芡汁一起吃，非常享受！\n\
        \t\n5/5 环境：\n四季的环境一直是我最爱的，西湖边的闹中取静，江南园林的感觉，以前基本都是中午或者傍晚时分用餐，这次到店天已全黑，翻桌期间等了一小会四处逛了下，别有一番韵味韵味（图12-17）。\n\
        \t\n5/5服务：\n金沙厅的服务意识很高，毕竟包含了15%的服务费。服务非常在意细节，比如到店主动帮忙挂了外套，用餐骨碟换的及时，每道菜都会简单介绍，以及当看到我选的蛋糕时持续的夸赞，给了满满的情绪价值。\n\
        \t\n4/5性价比：\n坦白说，金沙厅的性价比作为家常菜来说是可以的，但如果点了上千的龙虾鲍鱼海参，价格打不住。这次尝试了近千元的鲍鱼，是好吃的，但没有太高的性价比。价格上是真材实料还是智商税，专业的小伙伴可以评论区留言。\n\
