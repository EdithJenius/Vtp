      title: 18800一晚的崇左丽世🌴
      desc: '为了这扇窗说来就来

        因为比较临时只剩下双卧泳池别墅了

        在这住了三天 没有出过酒店

        酒店每个角角落落都摸清楚了😂

        一进酒店就有一个壮族欢迎仪式

        早餐 下午茶 晚餐都是含在房间免费送的

        酒店里面有旅拍 书吧 清吧 瑜伽 钓鱼 骑自行车 水疗中心 健身房 台球室 亲子游乐中心 晚上还有露天电影🎬

        ⚠️飞机飞到南宁机场 再坐2小时车才能到酒店哦

        #小众度假好去处[话题]# #广西[话题]# #广西崇左[话题]# #广西崇左秘境丽世[话题]#

