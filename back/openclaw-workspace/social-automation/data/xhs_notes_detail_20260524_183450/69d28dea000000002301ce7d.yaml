      title: 杭州西子湖四季：应该是国内最好的四季
      user:
        avatar: https://sns-avatar-qc.xhscdn.com/avatar/643015d09329aa25ed9182f2.jpg
        xsec_token: ABqAN5SNHEp3THuM-NLHlgap6kS2Yuh_P2-zSfjNB0MDc=
        user_id: 5e970c080000000001004a91
        nickname: 汉龟旺梓
      desc: "清明假期前一周仓促订房，四季基础房价来到8k-10k的夸张区间，仍能保持入住率近乎全满，不免让人好奇这样一家老酒店是怎样做到的。体验下来，确实让我一个没那么喜欢四季的人也重新开始考虑这个品牌。\n\
        \t\n房间（p1-p3）：入住前担心2010年开业的酒店会不会过于老旧，入住后发现完全不会，保养相当好，五金光亮、智能马桶、可投屏电视、戴森吹风机，最贴心的是老酒店插头少的问题也不用担心，酒店在床头准备了多口插座，甚至还能无线充电。\n\
        西湖游船早餐（p4-p6）：在清明节能免排队独享一艘船加导游的含金量不用多说，除了价格三千多稍贵没有其他缺点。\n金沙厅（p7）：住客可以优先安排，赠送的酱料记忆最深（可惜不对外售卖），脆皮鸡好吃不贵。\n\
        酒店公共区域（p9-p17）：人少景美，出了一次酒店感受到西湖边恐怖的人流量后才感受到酒店的好。\n\t\n当然也有小缺点❌\n1️⃣半自助早餐选择相对来讲不多，好在味道尚可。\n\
        2️⃣最大的问题！节假日期间酒店交通管制，打车出行无法定位到酒店，同时酒店也没有相应的接驳安排，唯一能做的就是和客人一起叫车并让司机往前多开点（但管制时行不通，司机会被拦）。\n\
        最后花费了一千一的天价坐酒店的车打到了万象城[睡觉R]这个收费也很奇怪，市区包车一小时五百，杭州东站一千一，酒店员工坚称去万象城要按照杭州东站的价格收费，实际就是在市区开了四十分钟。\n\
        \t\n#春天就要逛公园[话题]# #四季酒店[话题]# #西湖[话题]# #杭州[话题]# #酒店[话题]# #清明节[话题]# #奢华酒店[话题]#\
        \ #酒店天花板[话题]# #园林[话题]#"
