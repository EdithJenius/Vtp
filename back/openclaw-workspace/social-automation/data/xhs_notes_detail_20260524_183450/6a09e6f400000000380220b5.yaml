    note_card:
      title: 我的海南度假plog
      desc: '人真的需要定期给自己放个假

        4月的尾巴来解锁一下假期

        这次只住进了海南清水湾金普顿酒店

        这里的度假的松弛感直接拉满

        「海南金普顿」是懂怎么让人慢下来的

        在这里

        可以赖到12点去路间餐厅吃早午餐

        吃饱喝足就把自己“扔”进泳池区的吊床里

        听着海浪声发呆

        老钱风+时尚感的装修每个角落都很出片

        不用刻意摆拍都很有质感

        下午时分可以去电竞中心化身竞技选手

        该说不说这里的设备速度真的飞快

        到了晚上 Bar Ronero的酒单很有心思

        晚风里的一杯 刚好接住所有情绪

        不用赶行程不用找攻略这里本身就是目的地

        在这里度假的意义就是什么都不用急

        #海南金普顿[话题]# #陵水[话题]# #清水湾[话题]# #度假酒店推荐[话题]# #老钱风度假[话题]# #我的日常[话题]# #男生穿搭[话题]# #假期充电[话题]#
