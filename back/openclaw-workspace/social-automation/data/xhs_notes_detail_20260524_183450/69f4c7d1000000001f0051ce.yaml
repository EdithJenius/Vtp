      desc: '崇左的德天瀑布还有明仕田园感觉都不值得大老远来一趟，没有说他们不好的意思，就是对我个人来说飞机+开车的时间成本有点高，感觉去商业化更成熟的阳朔还简单一点，毕竟就单纯的风景来讲也没有差很多，所以如果去崇左不体验他的“野奢慢活”会有些些遗憾。

        丽世综合体验下来我给到夯，值得他的价格，从出圈的大堂景观到房间设计，都很让人惊艳。作为中国名气最大的野奢酒店之一，反正没有让我失望。酒店服务水准在线，活动也很多，下午有各种现场制作的下午茶小食，有垂钓区，也有自行车电动车可以骑行到明仕田园。

        当然也有很多付费活动可供选择，我们选了竹筏下午茶，竹筏的路线是酒店独占的河段，沿途风景真的很漂亮了，个人觉得很值得。回来正好赶上酒店的入夜仪式，点篝火的同时还有壮族阿姨唱山歌，很有氛围感了。

        但整个酒店我最喜欢的part其实是他的房间和床品，睡觉太舒服了，我作为一个常年吃安眠药入睡的人久违的睡了个美美的觉。

        唯一美中不足的就是餐厅不好吃，谈不上难吃，但就是不好吃，可能广西好吃的东西太多了，餐厅水平还真不如外面的好吃，所以餐厅不推荐。'
    id: 69f4c7d1000000001f0051ce
