      title: 吃金沙厅的Strong哥 拍了几十张图
      desc: "不得不说，雨西湖雨杭州更美了\n太适合不赶行程的找个舒服的地儿“荒废生命”了\n所以疯狂拍照拍视频，什么好看的都想记录\n\t\n每次来杭州必吃金沙厅，而且唯爱这个靠窗位置\n\
        这次约的一点半，正好上午植物园溜达过来\n细雨中的金沙厅，冒白烟我说是白素贞端午显形了，哈哈\n\t\n蟹粉汤包，黑松露素菜包，梅干菜蒸笋壳鱼，番茄上汤煮蔬菜，陈皮红豆沙\n\
        唯独觉得黑松露焗鸡一般，底部也是菌菇，导致有很单调的“土”味儿\n\t\n@吃货薯\n#西湖[话题]# #杭州美食[话题]# #杭州拍照[话题]#\
