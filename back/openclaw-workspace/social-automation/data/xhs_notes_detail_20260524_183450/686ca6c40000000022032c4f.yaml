  - id: 686ca6c40000000022032c4f
    model_type: note
    note_card:
      title: 崇左秘境丽世明显被高估了
      desc: "崇左回来大半个月了，可以静下心写点感受了\n适逢假期，这段时间里又去了一些其它酒店\n包括目前正在泡着的溧阳涧谷温德姆\n和崇左丽世都是相似的避世型酒店\n\
        温德姆品牌和丽世有差异，因此定价上也是有明显差异的\n但实话实说，作为住店客人的感受我明显觉得溧阳温德姆是更好的\n\t\n先看图吧\n图[一R]-图[九R]崇左丽世\n\
        图[一R][零R]-图[一R][八R]溧阳温德姆\n\t\n崇左丽世得天独厚的优势是喀斯特地貌的奇山秀水，在全世界都很稀缺。丽世的客房餐厅和娱乐室公共空间的视角目光所及之处大都为私家景区有很强的避世感，特别酒店大堂设计的画框式景观堪称惊艳，大部分客人都是为了那一个视角的照片跋山涉水来的吧\n\
        \t\n但是说实在的，其它方面没有特别特别出彩的：\n1⃣酒店空间不算很大，房间而言除了景观独一无二，装修风格算低调奢华的但也没一骑绝尘。可以泡的内容和空间都有限\n\
        2⃣收费项目定价离谱，简单地说就是物无所值。竹筏下午茶两个人收费988，加一个娃加168，喝的是气泡葡萄汁和可乐，吃的甜点也很普通量更是很应付。更离谱的是德天瀑布景观下午茶，3688/2个人一小时，加一个人加500，还只能卡着钟点预约不能超时，点心品质也是一样只能追求个打卡效果，真的最低性价比没有之一了。去德天瀑布的稻田咖啡馆喝一杯有啥区别了，距离还近很多了\n\
        3⃣服务一言难尽。作为顶级的野奢酒店，整个酒店从房间到餐厅喝不到一杯稍微像样点的咖啡，餐厅的咖啡是自动咖啡机煮的用的豆子也很一般，远不如很多其它度假酒店，不知道凭这点怎么满足咖啡爱好者包括国外游客的刚需；到酒店那天在门口吃了迎宾的冰粉，孩子觉得好吃阿姨说喜欢随时来吃。结果退房那天孩子跑门口去吃，被告知12点以后才能供应，但是退房时间是12点前，我们质疑这不是走形式不让离店客人吃吗？阿姨回是的，和迎宾态度判若两人\n\
        \t\n总之，酒店是很有特点或者说独一无二的，但是不是值一晚5000的房价大家见仁见智吧\n\t\n溧阳温德姆住了三天，去之前也看了很多评价有好有坏也有提醒避雷的，但我们玩了之后，感觉非常舒服，且不说环境比丽世大了很多，私家娱乐项目也不少很多还都是免费的，收费项目也价格合理\n\
        \t\n都是管家式服务，我得到的体验明显是温德姆好于丽世。举两个例子，我们去喂羊驼没注意要在大堂买喂食，联系管家马上让人开车免费送了两袋来；有一天我们在酒店吃晚餐一道菜感觉不够入味，买单时反馈了一下，走到门口就通知我们退款了\n\
        \t\n#崇左丽世[话题]# #溧阳温德姆[话题]# #野奢酒店[话题]# #崇左[话题]#"
