        type: topic
      last_update_time: 1779616219000
      desc: "度假的意义就是放弃意义。\n\t\n这次避开拥挤人群，来到了海南清水湾金普顿酒店，几乎不做计划就能被很好的照顾到！\n路间的早午餐营业到12点，对我这种懒人休假太友好了，观海餐厅的海鲜set很新鲜，最近大部分都吃白肉发现好像更适合自己的体质～\n\
        酒店公区还设有无边泳池，随手一拍都感觉置身东南亚的氛围感！\n傍晚时刻去拿着一杯鸡尾酒，踩在细细软软的沙滩上，人生的意义都藏在这一刻里。\n每次短暂的出逃，就足够撑很久～\n\
        \t\n#治愈系海岛生活[话题]# #howto美味旅行[话题]# #浪漫在逃度假人[话题]# #度假模式开启[话题]# #Kimptonfriends[话题]#\
