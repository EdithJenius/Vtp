    note_card:
      note_id: 68b30aa2000000001c032eb2
      title: 我竟然看了一场史诗级的故宫的夕阳
      desc: '北京文华东方酒店的酒吧Mo太美了吧！！

        这个酒吧不仅户外露台的视野绝美，能俯瞰故宫的主体建筑。鸡尾酒也很出片，每一期都有与众不同的打卡鸡尾酒。

        这次朋友选了熊猫和角楼，都是很有特色的鸡尾酒，不过熊猫的冰块有点太大了，和杯子不太搭。

        我选了一杯纯饮加冰的麦卡伦，味道超好喝！很香！男孩子可以试试呢[哇R]

        菜单的隐藏菜单，需要拿紫光灯才能看见。

        而且酒吧的大门，还有一个隐藏按钮，按了之后门才会开，真的好奇妙。

        [向右R]位置：王府井·王府中环 5楼（需要打电话预定哦）

