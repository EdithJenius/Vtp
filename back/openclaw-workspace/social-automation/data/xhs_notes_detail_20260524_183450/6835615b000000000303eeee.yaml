  - note_card:
      note_id: 6835615b000000000303eeee
      desc: "金普顿和英迪格的开业终于让这座会唱歌的沙滩焕发出新的生机\n\t\n开业前一天到\n来做酒店的第一批客人\n\t\n酒店公区极富艺术感\n\
        前台隐于府邸入口\n光影和细节交织如画\n\t\n打工小狗seven每天下午会出现在大堂\n和每一个客人贴贴\n\t\n一楼的客房直通泳池\n适合呼朋唤友一起来嗨\n\
        楼上则适合静享海域\n尾号30的房号看海最正\n记得和前台备注\n\t\n#度假酒店[话题]# #三亚酒店[话题]# #金普顿酒店[话题]# #新开业酒店[话题]#\
