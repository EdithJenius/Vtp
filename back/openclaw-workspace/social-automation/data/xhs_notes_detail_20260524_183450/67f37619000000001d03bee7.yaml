  - id: 67f37619000000001d03bee7
    model_type: note
    note_card:
      type: normal
      desc: '我刚到的时候觉得酒店太小了，很难承重“度假村”的称号，但是细细走下来，觉得真的非常精美和宁静，越逛越喜欢。尤其出门走了一下旺季的旅游景区，真的回来就是一个感恩和知足。

        首先说说最大的优势：精美，只有不到100间客房，非常的宁静。整个院落虽然不大，但是植物布置得非常精巧，从颜色搭配到形状修理，都能看出层次和设计感。强烈推荐酒店的游船活动。我赶上清明节，为了保证西湖游船数量（和酒店小船都归属市政管理），酒店只有3条人工摇橹船供住客提前预约，可以预约1小时的时段，能安排船上早饭或下午茶。码头是酒店私有的，水域是西湖的公共水域一部分，但是船只非常少。一小时的时间，足够游览，看看鸟，看看桥，体会杭州花红柳绿的春天美景，同时能够彻底的避开旅游胜地的喧嚣。我选择的8点船上早饭，这一小时让我觉得值回票价。

        位置：步行到西湖边景区大约10分钟，走到印象西湖演出大约15分钟。问题是节假日西湖景区限行，不登记的车辆出入困难，同时频繁交通管制让周边交通很拥堵。所以步行虽然近，但是也缺乏别的选择。步行还可以到达杭州植物园，人少，景美，还有免费的韩美林艺术馆，推荐。我还乘坐了7路公交车前往灵隐寺，坐车特别方便，但是下车看到人从众，直接掉头回来了。顺着酒店的小路可以直接走到盖叫天故居，是一个京剧名角的家，没人，很漂亮，很值得去溜溜弯。

        餐饮：酒店有大名鼎鼎的金沙厅是中餐，非常符合游客口味，清淡、选择丰富，都在具有本土特色的基础上做了更大众化的改良。西餐厅WL其实也还可以，坐在户外主打环境好。酒店有这两个餐厅，让“足不出户下江南”成为了可能。两个餐厅的共同点都是饮料和酒非常贵，饭菜价格可接受。酒店门口还有绿茶旗舰店，各种外卖也可以送达。

        服务：令我印象深刻的是酒店有给7岁的小朋友单独准备了一张小汽车形状的房卡，这是我们以前没见过的，小朋友每天很郑重的收房卡、负责开门锁门，给旅行增添了小确幸。

        其他：房间、健身房都非常标准，没有什么值得说的，但是也没有太明显的短板。

        总体来讲，喜欢！#四季酒店[话题]# #杭州西子湖四季酒店[话题]#'
