      desc: '崇左丽世还是很期待的一家度假酒店。

        图1-3是大堂招牌明信片式的美景，无须多言。

        早餐(图5)有点单部分，算正常水准。

        泳池(图4)人不多，因为有的房型是有私人泳池的。

        现在Le Labo算是奢华酒店备品的标配了吧，

        Lux选的是22号，倒挺符合我的喜好的。

        前几天暴雨水位太高，下午茶没有开放，有点可惜。

        一个傍晚我们去了明仕那里的稻那里，

        人造景观很一般，还是自然景观比较漂亮(图9-11)。

        当然如果想凹造型拍照还是可以的。

        另一个傍晚我们去了Citta餐厅(图12-14)，推荐！

        食物都很不错，一楼景观位有300多的消费要求，

        国定假日还是建议大家提前预约一下，2小时限时。

        哦对了，明仕那里的中餐避雷，贵而且不好吃。

        明仕田园我们还选了一家酒店入，大新明仕长留山居。

        五楼的景观也很不错(图15)，国庆晚上还看到了烟花。

        房型是酒店唯二的边套(图16)，270度景色无遮挡。

        酒店有免费钓鱼活动，上鱼特别快特别多。

        满足了家里小学生钓鱼的所有乐趣(图17-18)。

