  - id: 69958027000000000a02aa35
    model_type: note
    note_card:
      note_id: 69958027000000000a02aa35
      title: 三亚金普顿酒店🌴真实入住体验
      desc: "首先房间设施确实很好\n洗浴用品、配套电器都是天花板级别！\n整体服务也还是很不错的！\n\t\n本次除夕夜入住8X02酷享海景房\n房间风景很不错，\n\
        面积比较小。\n靠近电梯口，来来往往的人非常吵❗️\n整体体验7/10，一般般的体验\U0001F31F\n\t\n然后说说这次体验一般般的点吧：\n\
        1️⃣酒店定位是轻奢、年轻、社交❓\n天价定这个酒店也是想避开人群，\n有机会好好享受一下年轻人的生活。\n但是酒店定位明显是更偏向小朋友\n（儿童乐园非常高级、干净）\n\
        酒店从一天的早餐开始，就很嘈杂。\n那个所谓的社交时光，真的很鸡肋[新月R]\n\t\n也许在三亚这个地方不要主打年轻人群体，\n变成干净又高级的儿童酒店还是不错的\n\
        \t\n2️⃣公共区域和设施拥挤\n金普顿和英迪格公用共区，\n泳池啊、儿童乐园、餐厅啊，就很拥挤\U0001F937‍♀️\n这里是我在三亚这么多天，\n\
        见过游泳里的人最拥挤的酒店了。\n家庭泳池真的像下饺子一样\U0001F95F\n前一天在洲际的两晚，那个家庭泳池真的舒服得多！\n\t\n3️⃣假期不适合拍照\U0001F4F7\
        \n我们是因为看到酒店宣传的美图才过来的\n酒店和洲际集团当时请了很多网红来拍照宣传\n也不是想拍到多好的照片，\n但宣传里有个网红泳池是只给别墅泳池房才能进去\n\
        \t\n然后最最难过的\U0001F62B\U0001F447❗️\n❗️另外一个最出片的网兜泳池机位，根本没办法拍照\U0001F4F7\n酒店明码宣传的打卡点，旅拍也会带过去拍照\n\
        那里居然不是成人泳池，而是儿童家庭泳池。\n这个设计的，个人认为真的很不合理！\n不应该把儿童玩的地方和设计的拍照点放在一块。\n然后在两天的时间里，根本没有一刻是能拍照的。\n\
        要不就全是人头，要不就都是打起来的波浪花～\n\t\n4️⃣草地和沙滩区域维护的很差\n都说清水湾的沙滩巨美！\n这里应该是清水湾最丑的沙滩了\U0001F3DD\
        ️\U0001F92E\n椰子树全部被支架围住，\n靠近沙滩的草地也是光秃秃的。\n莱福士酒店的沙滩和草地真的随便出片\n\t\n\U0001F4D2\
        总结：\n享受没享受到，\n拍照也根本没有条件\n如果酒店宣传和定位上偏向儿童和带娃\n会好接受很多。\n\t\n反正如果你是想享受一段安静的时光，\n\
        想拍点好看的照片，\n寒假暑假、国庆五一就不要考虑这里了\n旺季住洲际，都比这里更加清静舒服。\n没小朋友的淡季再来吧～\n其他同价位的酒店，要好看好拍得多～\n\
        #豪华型酒店[话题]# #酒店天花板[话题]# #高品质酒店[话题]# #三亚金普顿酒店[话题]# #陵水金普顿[话题]# #三亚酒店避雷[话题]#\
        \ #三亚酒店测评[话题]# #新年旅行第一站[话题]# #避雷清水湾金普顿[话题]# #清水湾金普顿[话题]#"
