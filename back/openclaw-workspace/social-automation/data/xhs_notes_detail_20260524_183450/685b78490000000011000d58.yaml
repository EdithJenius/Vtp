      desc: "第一家住的文华东方是王府井的文华东方\n\t\n环境：整体的环境很中式典雅 装修也是偏中式 无论是房间还是公区 房间很干净 入住送了水果和香槟\
        \ 没有住到紫禁城View的房间还是比较遗憾 浴室很大 卫生间是单独分开；公区也很高级 人也不多\n\t\n服务：前台工作人员都Nice也很Professional，很热情\
        \ 入住是前台带我去的房间也简单介绍了一下\n\t\n餐饮：早餐自助相对选择可能没那么多 但是煮的面食还可以；下午茶的点心很高级口味也还不错，冷泡茶也很好喝；紫膳的正餐也还可以，烤鸭和鸭汤特别好吃好喝\
        \ 可以试一下；当然角楼冰块的鸡尾酒也很不错，边喝边看紫禁城还是蛮chill的\n\t\n运动：健身房不大但是够用 泳池相对也比较小 但是空间比较私密\
        \ 相对也不会被打扰 更衣室也有桑拿汗蒸房\n\t\n位置：在王府井中环 离天安门 故宫景点什么的都很近  不过二环有一点点堵\n\t\n#staycation[话题]#\
        \ #文华东方[话题]# #高品质酒店[话题]# #新中式[话题]# #新中式穿搭[话题]#"
