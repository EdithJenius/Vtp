      - id: 66078e2100000000020243f7
        name: 清水湾金普顿
        type: topic
      time: 1757683562000
      last_update_time: 1758612434000
      note_id: 68c41f6a000000001d009a01
      title: 清水湾躺了三天
      desc: "趁着暑假刚过⛱️\n来清水湾金普顿试试水宅个三天\n带了几套老钱风帅帅出片马上出发\U0001F6EB\n找了个适合我这个淡人的schedule\n\
        \t\n第一天到了直接在路间吃晚餐\n品了Bar Ronero朗姆特调\n海景房 隔音有点好\n忍不住打开窗躺在阳台上听海浪声一层层漫过来的声音\U0001F30A\
        \n实现了海浪声治愈一刻\U0001F499\n\t\n第二天就是一个疯狂假日opening\n都知道金普顿是出了名且很用心的设计\n在营业到12:00的路间餐厅吃过早午餐后\n\
        坐在大堂看着海边何曾不是一种悠闲\n下午参加了社交时光 温柔又治愈 慢悠悠的做自己\n晚餐在英迪格的观海吃了糟粕醋火锅海鲜盛宴\U0001F99E\U0001F9AA\
        \n蘸料真的好美味\U0001F924回到杭州依旧怀念\n\t\n在KIMPTON的三天\n看到了落日晚霞 海边小散 泳池放松\n私人沙滩安静的海让我很放空\n\
        往回走偶遇蓝调的时刻觉得好幸福\n不用太赶的旅途 充满电量的假期\n在这实现了我短短的理想假期心愿\n下次我们再见\U0001F44B\U0001F3FF\
