      type: normal
      title: 杭州最贵酒店Top10｜奢华避世天花板💸
      desc: "杭州自古便是文人墨客笔下的\"人间天堂\"，这些顶级酒店各有千秋，是体验江南奢华与诗意的上佳之选。\n\t\n1️⃣杭州秋水山庄\n参考价格：12800元/晚起\n\
        亮点：西湖边SLH成员，仅12间房，半开放式无边泳池直面西湖，民国风情，部分客房配备智能调温床垫\n\t\n2️⃣杭州法云安缦\n参考价格：6555元/晚起\n\
        亮点：毗邻灵隐寺的古村落改造酒店，禅意十足，环境隐秘清幽，宛若避世\n\t\n3️⃣杭州西子湖四季酒店\n参考价格：6000元/晚起\n亮点：江南园林风格，坐拥黑珍珠三钻金沙厅，提供私人游船体验，深入西湖秘境\n\
        \t\n4️⃣杭州Vallie酒店\n参考价格：5800元/晚起\n亮点：近六和塔，仅8间房，极私密，拥有米其林星级法餐厅溪畔十九，隐于山谷\n\t\
        \n5️⃣罗莱夏朵·杭州紫萱度假村\n参考价格：3900元/晚起\n亮点：内有三家黑珍珠餐厅（解香楼、三嚥阁、曼殊），环境低调静谧，充满东方美学\n\
        \t\n6️⃣杭州香格里拉饭店·水知心居\n参考价格：3800元/晚起\n亮点：香格里拉旗下新高奢品牌，融合中式美学与极繁主义，坐拥西湖核心区湖光山色。\n\
        \t\n7️⃣杭州西溪悦榕庄\n参考价格：2900元/晚起\n亮点：坐落于西溪湿地内，全套房/别墅设计，标配景观阳台或庭院，可体验悦榕庄经典SPA\n\
        \t\n8️⃣杭州所见·西溪度假酒店\n参考价格：2850元/晚起\n亮点：深藏西溪湿地，所有客房临水而建，私密性极佳，营造避世渔隐的宁静氛围。\n\
        \t\n9️⃣杭州木守西溪酒店\n参考价格：2800元/晚起\n亮点：隐于西溪密林，设计现代简约，拥有私人码头和人气餐厅溪隐（创新江浙菜）\n\t\n\
        \U0001F51F杭州夕上·虎跑1934酒店\n参考价格：2400元/晚起\n亮点：民国历史别墅改造，毗邻虎跑泉，幽丽清雅，店内设有人气网红月芽自由餐厅（创意西餐）。\n\
        \t\n#杭州奢华酒店[话题]#  #杭州酒店[话题]#  #西湖酒店[话题]#  #杭州避世酒店[话题]#  #杭州酒店探店[话题]#  #杭州酒店[话题]#\
