      title: 海南丨清水湾金普顿
      desc: "25年开业，还没住过金普顿这个牌子，赶来体验一下\n\t\n公区不大，但胜在设施多：电竞中心、游池、social hour、健身房、儿童空间、桑拿房都很齐全\n\
        这个所谓的social hour叫“棋观”，其实是特别版的酒廊，提供了室内高尔夫、象棋、台球、影音室和免费的酒水跟小食，是个有趣的尝试\n\t\n\
        最好的点有两个：一是吃的不错，早餐半自助式，味道不错很丰富，营业到12点简直懒虫福音！中餐厅的九层塔浸鸡腿螺给我必点；二是房间质感和审美在线，躺在里面度假感很足\n\
        \t\n不过，人是真的多！ci之后等了5个小时才出房，期间虽然给了个电竞房先休息，但度假的心情还是毁一大半，怒要了2个公仔跟盲盒（我的时间就值这些东西了\U0001F971\
        ），加上公区和英迪格共享，不难想象旺季会是个什么景象\n#度假酒店[话题]# #酒店空间美学[话题]# #酒店天花板[话题]# #酒店推荐[话题]##海南[话题]#"
