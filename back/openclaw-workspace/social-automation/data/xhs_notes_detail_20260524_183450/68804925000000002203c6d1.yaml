      note_id: 68804925000000002203c6d1
      type: normal
      title: 花了大几万，住进北京胡同是一种什么体验
      desc: "从阿布扎比回来，正好落地北京大兴机场，来都来了，自然要在北京玩上两天～\n酒店选了从开业到现在一直很火的前门文华东方，好奇凭什么一家酒店能卖到那么贵‼️\n\
        \t\n入住后才发现，服务的最高境界，就是将你的情绪价值拉满！而他们家真是把仪式感做到了极致～\n\t\n✨入住前两天，酒店管家就已经开始联系，确定了我们的航班号，提前安排好了房间～\n\
        \t\n✨入住时每个人都会有专属的房卡，上面☝️竟然还印着属于自己的名字！就连小朋友的房卡，都别出心裁的作成了手串，戴上后都没舍得摘下来。\n\t\n\
        ✨办理完入住，专属小车直接送回房～\n有别于其他酒店，前门文华东方的42间四合院，都是散落在草场胡同内的，推开门是摇着蒲扇，用京腔侃大山的大爷们！而关上门，则又是传统而不失新潮的的四合院～\n\
        \t\n胡同很小，所以连这车都是定制款，穿梭在胡同内，管家给我们讲着关于这片胡同的故事，还时不时的和胡同里的邻里们唠两句家常，颇有意思～\n\t\n\
        ✨推开那扇门，藏着的是烟火气里的隐奢体验，我们住的四合院，估摸着至少得有160平左右，在这寸土寸金的北京城中轴线上，这个含金量不言而喻～\n进门便是一个偌大的院子，也是恺恺最喜欢的一部分，房间是新中式的设计风格，竟可能的保留着四合院的原汁原味同时，又在设计上融入了许多时尚的元素，每一次随意的举起相机\U0001F4F7\
        ，都会不由的感叹一声，真美～\n\t\n✨因为提前沟通有小朋友入住，所以管家布置了帐篷、玩具等很多适合小朋友玩乐的内容～还有可爱的“才高”和“八斗”两只小猫，他们究竟是长什么样，那可得自己去胡同里寻找他们的踪迹了[偷笑R]\n\
        \t\n✨房间内的配置，都是高端体验，从mini bar里的饮料酒水，到洗漱日用，每一细节之处，都让你觉得这房价的含金量不停在上升～\n\t\n✨喜欢每天房间里都会有不一样的小惊喜，例如：管家贴心准备的遮阳帽，或盲猜一下今天会尝到什么样的地道老北京小吃呢？\n\
        \t\n✨ 我们当时选了套餐，里面含了每天小朋友的8小时看护服务！也就是说，我每天有了8个小时耳根子清净的时候～\n\t\n而小朋友则有了属于他的情绪价值！有管家陪着玩游戏、陪着看电影、陪着做pizza、陪着在胡同里寻宝，陪着聊天陪着笑～\n\
        \t\n虽然酒店距离故宫、前门和天坛仅数步之遥，但我们入住的几天，竟然都没走出过胡同～在自己的四合院里，已可以偷得浮生半日闲，光是一个胡同文化，就足矣让我们回味无穷～#北京旅游[话题]#\
        \ #北京胡同[话题]# #北京前门文华东方酒店[话题]#"
