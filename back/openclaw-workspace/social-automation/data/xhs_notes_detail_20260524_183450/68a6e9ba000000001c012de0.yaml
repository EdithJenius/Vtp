  items:
  - id: 68a6e9ba000000001c012de0
    model_type: note
    note_card:
      desc: '和朋友说走就走的旅行 入住陵水新开的金普顿。

        推门即是扑面而来的低调奢华——不张扬的质感。

        ✨第一次见设施这么完备的酒店

        SPA舒缓身心，电竞房唤醒活力，午后与好友对弈一局象棋，孩童在活动室自在嬉戏。入夜后，在Bar Ronero，微醺恰到好处。感觉情侣的浪漫，闺蜜的欢笑，家庭的温馨，在这里都能找到归属！

        😋味蕾与居所的双重享受🛁

        一日三餐皆都可以在酒店解决，餐食丰盈而且精致；

        路间营业到12点！晚起也能吃到全球的街头美食 。

        观海餐厅的海鲜盲盒食材好新鲜！

        房间内敛而考究，每一处设计都长在审美上——住了就不想离开。

        📷超多高颜值的机位

        满足了我们喜欢拍拍拍的需要！不管是室内还是室外，随手一拍，出片和呼吸一样简单😆 ！

        我们一起说笑，享受了三天的闺蜜时光 ，约定好下次还要来这里度假🏖️！

        #度假酒店[话题]# #治愈系酒店[话题]# #酒店天花板[话题]# #豪华酒店式享受[话题]# #奢华住宿体验[话题]# #设计感超强酒店[话题]#'
