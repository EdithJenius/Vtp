      note_id: 688049ff0000000017030ad7
      desc: "主包过生日，一直很想试试杭州黑珍珠三钻杭州西子湖四季酒店·金沙厅，总体下来体验感很不错，还会提前摆放生日布置牌，赠送生日面和饭后甜品（杨枝甘露）15%服务费一共1637元\n\
        \t\n关于预约：\n美团，公众号都可以预约，我们提前六天约了工作日晚上大厅不需要押金\n\t\n菜品：\n宋嫂鱼羹\U0001F44D\U0001F44D\
        \U0001F44D\U0001F44D\U0001F44D98*2\n鳕鱼肉，腐皮，粉丝，黑木耳，芹菜，胡萝卜\U0001F955，一致认为很鲜美，没有腥味，一人一碗的量刚刚好\n\
        金沙脆皮鸡\U0001F44D\U0001F44D\U0001F44D\U0001F44D\U0001F44D148\n招牌菜，脆脆的皮一点都不腻，两位半份正好\n\
        鲍鱼红烧肉\U0001F44D\U0001F44D\U0001F44D158\n配了青豆解腻，服务员会问两位一份还是两份，果断一份！如果是尝尝味道，完全够吃，红烧肉很软烂，鲍鱼一点点腥\U0001F90F\
        （可能主包嘴有点挑）\n榛果鸭肝酱伴葱油饼\U0001F44D\U0001F44D\U0001F44D128\n老公说比叶马的好吃，我觉得中规中矩，服务员会贴心得把酱拌好让我们拍美照\n\
        鸡油花雕蒸三门蟹\U0001F44D\U0001F44D588\n原本是冲着这道菜去的，黄酒清蒸，酒味有点重，没有想象中的那么惊艳，蟹很新鲜，但是味道有点奇怪\n\
        龙井炖奶\U0001F44D\U0001F44D\U0001F44D\U0001F44D48\n我们总结是抹茶味的焦糖布丁，加了龙井有点苦苦的，餐后解腻很合适\n\
        山竹冰淇淋\U0001F44D\U0001F44D\U0001F44D\U0001F44D\U0001F44D68\n搭配着底部开心果碎，冰淇淋酸酸甜甜的很好吃\n\
        饮料45*2\n雪碧、可乐\n\t\n免费：\U0001F31F\n赠送了一份生日面，里面有扇贝柱和鲜虾\n饭后甜品杨枝甘露，很好吃\n\t\n停车\U0001F17F\
        ️：\n酒店内部可以免费停车\n#杭州西子湖四季酒店金沙厅[话题]# #金沙厅[话题]# #杭州美食[话题]# #杭州黑珍珠[话题]# #杭州黑珍珠三钻[话题]#\
        \ #生日餐厅[话题]#"
