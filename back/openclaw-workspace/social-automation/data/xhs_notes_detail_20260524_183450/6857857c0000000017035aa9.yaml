      desc: "北京胡同的美，可以用非常有后劲的方式呈现\n达成在京城最难忘的一个初夏周末\U0001F343\n\t\n历史悠久的草厂胡同\n和文华东方和谐共生的新四合院\n\
        夏日光影和东方底蕴  直接美到起飞\n也刷新了中国酒店最贵房价\n\t\n对于一个爱逛胡同的外地孩子来说，\n怎么不算圆了一个北京梦呢？\n自己拎包小住\
        \ 并独享整个四合院，\n也是好多游客想要解锁的人生级体验啊\U0001F343\n\t\n\U0001F3EE北京前门文华东方酒店\n\U0001F3EE\
        Mandarin Oriental Qianmen, Beijing\n\t\nthe most experience city hotel now\
        \ in China\nwhere you could live in a Beijing dream,\nin the authentic local\
        \ Hutongs.\n\t\nAll the facilities and rooms are spread along 8 hutongs,\n\
        which in an open area to everyone.\nTime to check the new & the best Hutong\
        \ look\U0001F343\n\t\n夏日下午五点，就是图片里的最佳赏味时间\U0001F44C\U0001F3FB\n\t\n#和小红书游中国[话题]#\
