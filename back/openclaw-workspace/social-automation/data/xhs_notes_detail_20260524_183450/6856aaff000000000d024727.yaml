      type: normal
      title: 前门MO｜在北京四合院百年古树下干杯🥃
      desc: "·\n\U0001F6B6\U0001F3FE‍♀️‍➡️商业资讯/亚洲城市商业探索——北京。\n-\n\U0001F4DD北京前门文华东方开业即刷爆朋友圈。\n\
        CCD郑中这次的设计仍然可圈可点，将坐落于明代草厂胡同的老四合院改造，保留青砖灰瓦结构，修旧如旧。\n将胡同基因，重塑京魂。\n-\n✔️酒吧名灵感源自地理位置草厂胡同「十条」。\n\
        英文名\"TIAO\"跟\"调\"同音，有\"调和\"和\"鸡尾酒调配\"的意思。空间有两层，以“串门儿”为动线——私密包间藏于一层，二层露台可俯瞰胡同棋格屋顶，中央庭院百年古树悬灯映月，夏秋季节格外舒适。\n\
        整个空间随处可见传统元素（榫卯结构梁柱/仿宋酒器/中药柜式吧台抽屉）与现代摩登的对话（勃艮第红丝绒沙发、金属镜面天花、DJ台光影装置）。\n-\n\U0001F943\
        酒单设计紧扣在地文化，创意十足。\n目前已经更新到第二本了，之前去喝了大热的「水银」和一杯古典。新酒单是调酒团队实地采风草厂三条至十条，每杯对应一条胡同的灵魂，比较感兴趣「叹逍遥」「酸葡萄」。\n\
        \U0001F932\U0001F3FD对了，入座给的mini小酒坛很可爱，永远偏爱有welcome drink的bar。\n·\n\U0001F68F\
        ADD：北京前门草厂十条1号（导航前门文华东方东北角）\n\U0001F552TIME：18:00-02:00（建议预约，walk in要压点到）\n\
