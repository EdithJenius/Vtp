      title: 金沙厅你过于老钱了
      desc: '跟着老板也是让我蹭上了金沙厅

        位置在西湖四季酒店 整体是中式园林风格

        没有想象中的大 不过一圈逛下来

        感觉有很多细节可以细细品

        比如院落里喷泉⛲️ 和庭院走廊的艺术画

        确实高级耐看 老钱感拉满

        餐食🥢：

        印象最深的几道菜

        “西湖龙井炖蛋” 细腻丝滑甜度适中好评👍

        “燕窝藜麦粥配”（应该是这个名字）很特别的味道感觉非常养生

        “毛血旺”888的毛血旺成功吸引了注意力但确实吃不明白 千万别点[笑哭R]

        服务🤵‍♀️：无功无过 一般

