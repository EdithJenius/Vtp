  items:
  - model_type: note
    note_card:
      desc: "为了这座酒店，专门来的广西，住过这么多酒店，崇左秘境丽世度假村从此成为我心中的天花板，内心从好贵啊变成好想再来只需要打开房门的一刹那，野奢排行前五的酒店它实至名归！\n\
        \t\nP1-P4 这次入住的是4101，一楼的房间自带一个大露台，比二楼三楼更有性价比，推开房门就是山水画，每个房间自带泡池私汤，可以让管家帮忙准备泡浴，白日看风景，傍晚听蝉鸣，下次来还想住这个房间～\n\
        \t\nP5 19:00开始入夜仪式，唱壮族民歌\n说起入夜仪式，还有欢迎仪式，敲锣，净手，送的冰粉超级好吃\U0001F60B\n\t\nP6 P7星空影院，每天会有电影可以看，很浪漫，但是蚊虫较多，酒店房间有送白虎膏，可以涂完再去\n\
        \t\nP8 P9酒店大堂，这里真是这个酒店的标志性特点了，谁不是为了这个景色专程而来！！\n\t\nP10酒店必经之路，拍照打卡圣地！不过小心有水蛇\n\
        \t\nP11 P12无边泳池，不用多说，超级出片，清透感十足\n\t\n说了优点就吐槽一下缺点，四五千一晚的酒店，更何况是水果大省，欢迎水果就是：苹果，橘子，猕猴桃，梨子。不知道的还以为住的是希尔顿，另外就是这里比较偏，从南宁开车过来需要两个多小时，离德天瀑布40分钟，建议租车游玩。其他真是挑不出毛病了，每一个路过的工作人员都很有礼貌，希望不久的将来，还能再来～\n\
        #小众度假好去处[话题]# #藏于山水间的度假胜地[话题]# #度假酒店[话题]# #广西旅游[话题]# #崇左秘境丽世[话题]# #度假村[话题]#\
        \ #住进风景里[话题]#"
