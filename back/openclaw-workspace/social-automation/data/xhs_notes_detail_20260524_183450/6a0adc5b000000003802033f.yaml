      title: 在海南度假的那几天
      desc: "这几天都在海南清水湾的金普顿酒店\n每晚听着海浪声入睡，就是天然的白噪音\n在这里时间都变慢了\n入住的是泳池联通房\n每天早上睁眼\n\
        就可以推开门跳进泳池戏耍\n松弛感从这一刻就开始了\n不用急着出门\n路间餐厅的早午餐一直营业到12点\n非常让我惊喜的是餐点的种类丰富\n下午的时候可以去打卡很有特色的「棋观」\n\
        可以下国际象棋，还可以打台球\n玩累了就在这个空间和朋友聊聊天小憩一下\n电竞中心是废土沙丘风格\n在这里拍照真的非常之酷炫\n这里的康乐活动也超有意思，玩了匹克球\n\
        最后在BAR RONERO结束了一天\n实名夸夸调酒师的手艺非常棒\n\t\n#海南金普顿[话题]# #陵水[话题]# #清水湾[话题]# #度假酒店推荐[话题]# #老钱风度假[话题]# #我的日常[话题]# #男生穿搭[话题]# #假期充电[话题]##Kimptonfriends[话题]# #理想假期[话题]# #海边时髦假期[话题]#"
