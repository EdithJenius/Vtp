    note_card:
      type: normal
      desc: "1️⃣ 崇左秘境丽世度假村\n\U0001F4CD大新县明仕村\n藏在祖国西南边陲的「山水秘境」！每间客房都自带270°落地窗观景台，拥有明星同款星空无边泳池\U0001F4A6\
        ，不仅能拍到《花千骨》同款仙境倒影，还提供在地风味早餐及下午茶。\n\t\n2️⃣ 崇左在野宿集·野白​​\n\U0001F4CD大新县明仕旅游度假区\n\
        由老糖厂改造而来，保留了红砖墙与铁轨元素，却在庭院里种满了紫色花海和青竹茶园\U0001F375~ 所有房型带私汤泡池或观景阳台，躺在床上就能看见喀斯特石山倒映在泳池里！\n\
        \t\n3️⃣ ​​崇左明仕雅居​​\n\U0001F4CD大新县明仕村濑湍屯\n\U0001F33F房间设计把壮族文化融入细节，铜鼓元素吊灯、壮锦地毯、手工编织挂毯，连早餐都有五色糯米饭和恭城油茶！\n\
        \t\n4️⃣ 崇左花山笙美度假村​​\n\U0001F4CD宁明县驮龙乡左江畔\n坐落在左江转弯处的半岛上，抬头就是世界文化遗产「花山岩画」的赭红崖壁，低头是碧绿的江水泛着粼光～\n\
        \t\n5️⃣ ​​崇左在野宿集·既见​​\n\U0001F4CD大新县明仕旅游度假区\n在野宿集的「治愈系担当」！藏在一片百年古荔枝林里，白墙灰瓦的院落被绿植包裹，像一颗遗落的绿宝石\n\
        \t\n6️⃣ ​​崇左江州笙美度假村​​\n\U0001F4CD江州区太平街道\n酒店依左江而建，园林里种满了百年古榕和三角梅，连泳池都藏在竹林后面，像一块被绿植包裹的翡翠\n\
        \t\n7️⃣ ​​崇左大新明仕长留山居​​\n\U0001F4CD大新县明仕村\n「长留」二字取自「山水长留，岁月静好」，藏在明仕田园最幽静的角落，周围是连绵的稻田和竹林\n\
        \t\n8️⃣ ​​崇左发呆坡·云舍​​\n\U0001F4CD大新县硕龙镇（近德天瀑布）\n藏在德天瀑布附近的山坡上，无边泳池像一块蓝宝石嵌在峰林之间。\n\
        \t\n9️⃣ ​​崇左龙州观堂酒店​​\n\U0001F4CD龙州县独山路\n酒店由民国时期的「法国教会学校」改造而来，红砖墙、拱形门、老楼梯\n\
        \t\n#怎么订酒店便宜[话题]#\n#发现宝藏酒店[话题]# #藏于山水间的度假胜地[话题]# #崇左[话题]# #崇左旅游[话题]# #崇左丽世[话题]#\
        \ #崇左酒店[话题]# #崇左住宿[话题]# #度假酒店[话题]# #休闲度假酒店[话题]#"
