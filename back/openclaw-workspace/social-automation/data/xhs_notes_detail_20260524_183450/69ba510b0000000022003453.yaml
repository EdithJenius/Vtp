      desc: "在清水湾的三天～\n度假难得早起健身和上瑜伽课喽\U0001F3D6️\n酒店住的是金普顿～去年新开的 环境和服务都出乎意料的好\n意式极简老钱  三亚拍出了迪拜的感觉\n\
