      at_user_list: []
      time: 1757591842000
      type: normal
      desc: "周末入住了2天金普顿，整体体验非常惊喜，适合年轻牛马度假！！\n\U0001F3E0公区环境（P3-6）：个人认为海南度假酒店绝对的天花板！肉眼可见造价不菲的各处装潢，低调奢华又处处有设计巧思，漫步其间绝对是一大乐趣，很好奇酒店或操刀的设计团队有没有获得一些设计奖项\U0001F60E\
        \n\U0001F6CF️房间设施（P7-8）：全自动马桶和戴森吹风机基本操作，大面积使用的奢石、卫浴区地砖的磨砂防滑处理、床头皮质软垫、可躺可坐的超大沙发、网红音响马歇尔，设计感+奢华感的完美融合\U0001F929\
        \n\U0001F32E餐饮（P9-12）：\U0001F4AF好评！早餐开放到12点，精华是现点现做的菜单，\U0001F950蝴蝶结可颂最好吃，☕️咖啡也有拉花！\n\
        \U0001F363日料餐厅醍醐也是来头不小，吃得我们是啧啧称赞\U0001F924\n\U0001F935\U0001F3FB服务（P13-14）：服务全程细节拉满\U0001F44D\
        Vicky管家随叫随到，Jacob和Hudson也为我们安排了同类房型最佳景观的房间，几位得知我们是纪念日入住还做了一系列非常周到细致的安排\U0001F495\
        ps开夜床服务提供长岛冰茶\U0001F379全程体验感非常好☺\n\U0001F942社交时光（P15-16）：17:30-19:00限时开放，娱乐项目包含：电子高尔夫⛳️各类棋♟️德州扑克\U0001F0CF\
        桌球\U0001F3B1 还有酒水小食果盘供应～个人感觉也是陵水金普顿必体验活动之一\U0001F47B\n\U0001F3AE电竞中心（P17-18）：15:00-03:00开放，最低价位是五人间单人88元/小时，虽然网费贵，但是除了贵没有缺点，这辈子没上过这么高级的网吧哈哈哈\U0001F974\
        在度假酒店网吧打游戏的感觉真的很不一般，网瘾人士必体验，值！\n\U0001F3D6️泳池：非常多人推荐，也是亮点之一，4个泳池很赞配套服务也很周到，游它！！\n\
        \t\n#度假酒店[话题]# #酒店爱好者[话题]# #发现宝藏酒店[话题]# #高品质酒店[话题]# #海南[话题]# #海南旅游[话题]# #陵水[话题]#\
        \ #陵水清水湾金普顿[话题]# #三亚[话题]# #三亚酒店[话题]#"
