<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热点商机 · 多维分析 v3</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f1923; color: #e0e6ed; min-height: 100vh;
}
.page { display: none; max-width: 1600px; margin: 0 auto; padding: 20px; }
.page.active { display: block; }
.header {
  text-align: center; padding: 20px 0 30px;
  border-bottom: 1px solid #1e3a5f; margin-bottom: 30px;
}
.header h1 {
  font-size: 2em;
  background: linear-gradient(135deg, #00d4ff, #7b2ff7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.header .subtitle { color: #8b9dc3; font-size: 0.95em; }
/* Nav */
.nav-bar {
  display: flex; gap: 4px; margin-bottom: 20px;
  background: #1a2332; border-radius: 12px; padding: 4px;
}
.nav-btn {
  flex: 1; padding: 10px 20px; text-align: center;
  border-radius: 8px; cursor: pointer; transition: all 0.2s;
  background: transparent; color: #8b9dc3; border: none; font-size: 0.9em;
}
.nav-btn:hover { background: #1e3a5f44; }
.nav-btn.active { background: #00d4ff22; color: #00d4ff; font-weight: 600; }
.back-btn {
  display: inline-block; padding: 8px 16px; margin-bottom: 16px;
  background: #1e3a5f; border: none; border-radius: 8px; color: #00d4ff;
  cursor: pointer; font-size: 0.85em; transition: all 0.2s;
}
.back-btn:hover { background: #1e3a5f; transform: translateX(-2px); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 20px;
}
.card {
  background: linear-gradient(135deg, #1a2332 0%, #1e2d44 100%);
  border: 1px solid #1e3a5f; border-radius: 16px; padding: 20px;
  position: relative; overflow: hidden;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 3px; background: linear-gradient(90deg, #00d4ff, #7b2ff7);
}
.card h2 {
  font-size: 1.1em; color: #00d4ff; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.chart-container { height: 260px; position: relative; }
.full-width { grid-column: 1 / -1; }
.card-wide { grid-column: span 2; }
/* Topic List */
.topic-list { max-height: 500px; overflow-y: auto; }
.topic-item {
  display: flex; align-items: center; padding: 12px 14px;
  margin-bottom: 6px; border-radius: 8px;
  background: #0f192366; cursor: pointer; transition: all 0.2s; gap: 10px;
}
.topic-item:hover { background: #0f1923aa; transform: translateX(4px); }
.topic-item.no-research { opacity: 0.6; border-left: 3px solid #4a5568; }
.topic-item.has-research { border-left: 3px solid #00d4ff; }
.priority-badge {
  padding: 2px 10px; border-radius: 12px; font-size: 0.75em;
  font-weight: 600; min-width: 32px; text-align: center;
}
.priority-高 { background: #ff444433; color: #ff4444; }
.priority-中 { background: #ffaa0033; color: #ffaa00; }
.priority-低 { background: #4488ff33; color: #4488ff; }
.topic-title { flex: 1; font-size: 0.9em; }
.topic-source { color: #6d8ca8; font-size: 0.75em; white-space: nowrap; }
.topic-hot { color: #f0b429; font-size: 0.8em; font-weight: 600; }
.topic-action {
  color: #00d4ff; padding: 4px 10px; border: 1px solid #00d4ff44;
  border-radius: 6px; font-size: 0.75em; transition: all 0.2s;
}
.topic-action:hover { background: #00d4ff22; }
/* Stats */
.stats-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.stat-item {
  flex: 1; min-width: 120px; text-align: center;
  padding: 16px; background: #1a2332; border-radius: 12px;
  border: 1px solid #1e3a5f;
}
.stat-item .num { font-size: 2em; font-weight: 700; }
.stat-item .label { color: #6d8ca8; font-size: 0.8em; margin-top: 4px; }
/* Detail Page */
.detail-hero {
  background: linear-gradient(135deg, #1a2332, #1e2d44);
  border: 1px solid #1e3a5f; border-radius: 16px; padding: 30px;
  margin-bottom: 20px;
}
.detail-hero h2 { font-size: 1.5em; margin-bottom: 8px; }
.detail-hero .meta { color: #6d8ca8; font-size: 0.9em; margin-bottom: 12px; }
.detail-hero .analysis-box {
  background: #0f192366; border-radius: 8px; padding: 16px;
  line-height: 1.6; font-size: 0.9em;
}
.research-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.research-card {
  background: #0f192366; border-radius: 10px; padding: 14px;
  border: 1px solid #1e3a5f44; transition: all 0.2s;
}
.research-card:hover { border-color: #00d4ff44; transform: translateY(-2px); }
.research-card .dimension { color: #00d4ff; font-size: 0.85em; font-weight: 600; margin-bottom: 6px; }
.research-card .content { font-size: 0.8em; color: #8b9dc3; line-height: 1.5; }
.research-card .hotel-tag {
  display: inline-block; padding: 2px 8px; margin-top: 6px;
  background: #1e3a5f; border-radius: 4px; font-size: 0.7em; color: #6d8ca8;
}
.no-research-banner {
  text-align: center; padding: 60px 20px;
  background: #1a2332; border-radius: 16px; border: 1px solid #4a5568;
}
.no-research-banner .icon { font-size: 3em; margin-bottom: 12px; }
.no-research-banner p { color: #6d8ca8; }
/* === TREE STYLE for Notes === */
.notes-layout {
  display: flex; gap: 20px; min-height: 500px;
}
.notes-tree {
  width: 300px; min-width: 280px;
  background: #1a2332; border-radius: 12px; border: 1px solid #1e3a5f;
  padding: 12px; overflow-y: auto; max-height: 600px;
}
.notes-content {
  flex: 1;
  background: #1a2332; border-radius: 12px; border: 1px solid #1e3a5f;
  padding: 20px; overflow-y: auto; max-height: 600px;
}
.tree-region { margin-bottom: 4px; }
.tree-region-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: 8px;
  background: #0f192366; cursor: pointer;
  color: #00d4ff; font-weight: 600; font-size: 0.9em;
  transition: all 0.2s;
}
.tree-region-header:hover { background: #0f192388; }
.tree-region-header .arrow {
  transition: transform 0.2s; font-size: 0.7em;
}
.tree-region-header .arrow.open { transform: rotate(90deg); }
.tree-region-header .count {
  margin-left: auto; color: #6d8ca8; font-weight: 400; font-size: 0.8em;
}
.tree-region-body { display: none; padding-left: 12px; }
.tree-region-body.open { display: block; }
.tree-hotel {
  margin: 4px 0; border-left: 2px solid #1e3a5f; padding-left: 12px;
}
.tree-hotel-header {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px; border-radius: 6px; cursor: pointer;
  color: #b388ff; font-size: 0.85em; font-weight: 500;
  transition: all 0.2s;
}
.tree-hotel-header:hover { background: #7b2ff711; }
.tree-hotel-header .arrow { font-size: 0.65em; transition: transform 0.2s; }
.tree-hotel-header .arrow.open { transform: rotate(90deg); }
.tree-hotel-header .count { margin-left: auto; color: #6d8ca8; font-size: 0.8em; font-weight: 400; }
.tree-hotel-body { display: none; padding-left: 12px; }
.tree-hotel-body.open { display: block; }
.tree-note {
  padding: 6px 8px; border-radius: 4px; cursor: pointer;
  font-size: 0.78em; color: #8b9dc3; transition: all 0.2s;
  margin: 2px 0; border-left: 2px solid transparent;
}
.tree-note:hover { background: #0f1923; color: #e0e6ed; border-left-color: #7b2ff7; }
.tree-note.active { background: #0f1923; color: #e0e6ed; border-left-color: #00d4ff; }
.tree-note .cat-tag {
  display: inline-block; font-size: 0.7em; padding: 1px 6px;
  border-radius: 3px; background: #7b2ff722; color: #b388ff; margin-right: 4px;
}
/* Note detail inside content panel */
.note-view-card { }
.note-view-card .meta-tag {
  display: inline-block; padding: 4px 12px; border-radius: 16px;
  font-size: 0.75em; margin-right: 6px; margin-bottom: 8px;
}
.note-view-card .body-text {
  background: #0f192366; border-radius: 8px; padding: 20px;
  line-height: 1.8; font-size: 0.85em; white-space: pre-wrap;
  margin: 12px 0;
}
.note-view-card .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.note-view-card .tag {
  padding: 4px 10px; background: #1e3a5f; border-radius: 12px;
  font-size: 0.75em; color: #6d8ca8;
}
/* No selection */
.note-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: #4a5568; font-size: 1.1em;
}
/* Filter */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-btn {
  padding: 6px 14px; border-radius: 20px; border: 1px solid #1e3a5f;
  background: transparent; color: #8b9dc3; cursor: pointer;
  font-size: 0.8em; transition: all 0.2s;
}
.filter-btn:hover { border-color: #00d4ff44; color: #00d4ff; }
.filter-btn.active { background: #00d4ff22; border-color: #00d4ff; color: #00d4ff; }
/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #0f1923; }
::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }
@media (max-width: 768px) {
  .grid { grid-template-columns: 1fr; }
  .card-wide { grid-column: span 1; }
  .header h1 { font-size: 1.4em; }
  .notes-layout { flex-direction: column; }
  .notes-tree { width: 100%; min-width: auto; max-height: 300px; }
  .notes-content { max-height: 500px; }
}
</style>
</head>

// ===== NAV =====
function navigate(page, params) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const pg = document.getElementById('page-' + page);
  if (pg) pg.classList.add('active');
  const btn = document.querySelector(`.nav-btn[data-page="${page}"]`);
  if (btn) btn.classList.add('active');
  if (page === 'location') renderLocation(params);
}
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => navigate(btn.dataset.page));
});

    new Chart(document.getElementById('categoryChart'), {
      type:'bar',
      data:{labels:Object.keys(cc),datasets:[{data:Object.values(cc),backgroundColor:['#b388ff','#00d4ff','#f0b429','#00e676','#ff6d00','#e040fb','#00bcd4'],borderRadius:6}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e3a5f44'},ticks:{color:'#6d8ca8'}},y:{grid:{display:false},ticks:{color:'#e0e6ed'}}}}
    });
    const sorth = [...t].sort((a,b)=>b.hotValue-a.hotValue);
    new Chart(document.getElementById('rankChart'), {
      type:'bar',
      data:{labels:sorth.map(x=>x.title.length>10?x.title.slice(0,10)+'..':x.title),datasets:[{data:sorth.map(x=>x.hotValue),backgroundColor:sorth.map(x=>x.priority==='高'?'#ff4444':x.priority==='中'?'#ffaa00':'#4488ff'),borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e3a5f44'},ticks:{color:'#6d8ca8'}},y:{grid:{display:false},ticks:{color:'#e0e6ed',font:{size:11}}}}}
    });
  }, 100);
})();

// ===== LOCATION DETAIL =====
function renderLocation(topicId) {
  const top = DATA.topics.find(x => x.id === topicId);
  if (!top) return;
  const loc = top.locationKey ? DATA.locations[top.locationKey] : null;
  const el = document.getElementById('locationContent');
  if (!loc) {
    el.innerHTML = `
      <div class="no-research-banner">
        <div class="icon">🗺️</div>
        <h3 style="color:#e0e6ed;margin-bottom:8px;">${top.title}</h3>
        <p>该热点暂无对应的地区调研数据</p>
        <p style="margin-top:8px;font-size:0.85em;">关联地点：${top.location} | ${top.spots}</p>
      </div>
      <div style="margin-top:20px;padding:20px;background:#1a2332;border-radius:12px;border:1px solid #1e3a5f;">
        <h3 style="color:#e0e6ed;margin-bottom:8px;">💡 商机分析</h3>
        <p style="color:#8b9dc3;line-height:1.6;">${top.analysis}</p>
      </div>`;
    return;
  }
  el.innerHTML = `
    <div class="detail-hero">
      <span class="priority-badge priority-${top.priority}" style="margin-bottom:8px;display:inline-block;">${top.priority}优先级</span>
      <h2>📍 ${loc.name}</h2>
      <div class="meta">关联热点：${top.title} · 来源：${top.sources.join(', ')} · 热度：🔥${top.hotValue}</div>
      <div class="analysis-box">💡 ${top.analysis}</div>
    </div>
    <div style="margin-bottom:12px;">
      <span style="color:#6d8ca8;font-size:0.85em;">关联酒店：</span>
      ${loc.hotels.map(h => `<span class="hotel-detail-link" data-hotel="${h}" style="display:inline-block;padding:4px 12px;background:#00d4ff22;color:#00d4ff;border-radius:12px;font-size:0.8em;margin:2px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background='#00d4ff44'" onmouseout="this.style.background='#00d4ff22'">🏨 ${h} →</span>`).join('')}
    </div>
    <div class="research-grid">
      ${loc.dimensions.map(d => `
        <div class="research-card">
          <div class="dimension">${d.dim}</div>
          <div class="content">${d.content}</div>
        </div>
      `).join('')}
    </div>`;
  // Attach hotel click handlers
  el.querySelectorAll('.hotel-detail-link').forEach(link => {
    link.addEventListener('click', () => gotoHotelNotes(link.dataset.hotel));
  });
}

// ===== NOTES TREE =====
function buildNotesTree() {
  const tree = document.getElementById('notesTree');
  const content = document.getElementById('notesContent');
  let html = '';
  
  DATA.regions.forEach(region => {
    html += `<div class="tree-region">
      <div class="tree-region-header" onclick="toggleRegion(this)">
        <span class="arrow">▶</span> ${region.name}
        <span class="count">${region.hotels.length}家酒店</span>
      </div>
      <div class="tree-region-body">`;
    
    region.hotels.forEach(hotel => {
      const hotelNotes = DATA.notes.filter(n => n.hotel === hotel);
      if (hotelNotes.length === 0) return;
      // Group by category
      const catGroups = {};
      hotelNotes.forEach(n => {
        const shortCat = n.cat.split('/')[0];
        if (!catGroups[shortCat]) catGroups[shortCat] = [];
        catGroups[shortCat].push(n);
      });
      
      html += `<div class="tree-hotel">
        <div class="tree-hotel-header" onclick="toggleHotel(this)">
          <span class="arrow">▶</span> 🏨 ${hotel}
          <span class="count">${hotelNotes.length}篇</span>
        </div>
        <div class="tree-hotel-body">`;
      
      Object.entries(catGroups).forEach(([cat, notes]) => {
        html += `<div style="margin:4px 0;padding-left:8px;">
          <div style="color:#6d8ca8;font-size:0.75em;margin:4px 0;">${cat}</div>`;
        notes.forEach((n, ni) => {
          const globalIdx = DATA.notes.indexOf(n);
          html += `<div class="tree-note" onclick="showNote(${globalIdx})">
            <span class="cat-tag">${n.cat.slice(0,2)}</span> ${n.title.length > 20 ? n.title.slice(0,20)+'..' : n.title}
          </div>`;
        });
        html += `</div>`;
      });
      
      html += `</div></div>`;
    });
    
    html += `</div></div>`;
  });
  
  tree.innerHTML = html;
}

// HotelName -> hotel index in regions tree
const hotelToRegionIdx = {};
DATA.regions.forEach((r, ri) => {
  r.hotels.forEach((h, hi) => {
    hotelToRegionIdx[h] = { regionIdx: ri, hotelIdx: hi };
  });
});

function gotoHotelNotes(hotelName) {
  // Switch to notes page first
  navigate('notes');
  // Wait for DOM update then expand tree
  setTimeout(() => {
    const info = hotelToRegionIdx[hotelName];
    if (!info) return;
    const regionHeaders = document.querySelectorAll('.tree-region-header');
    const hotelHeaders = document.querySelectorAll('.tree-hotel-header');
    if (!regionHeaders.length) return;
    const rh = regionHeaders[info.regionIdx];
    if (rh) {
      rh.querySelector('.arrow').classList.add('open');
      rh.nextElementSibling.classList.add('open');
    }
    let hotelHeaderIdx = 0;
    for (let i = 0; i < info.regionIdx; i++) {
      hotelHeaderIdx += DATA.regions[i].hotels.length;
    }
    hotelHeaderIdx += info.hotelIdx;
    const hh = hotelHeaders[hotelHeaderIdx];
    if (hh) {
      hh.querySelector('.arrow').classList.add('open');
      hh.nextElementSibling.classList.add('open');
      setTimeout(() => {
        hh.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const notes = hh.nextElementSibling.querySelectorAll('.tree-note');
        if (notes.length) notes[0].click();
      }, 100);
    }
  }, 50);
}

function toggleRegion(el) {
  el.querySelector('.arrow').classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
  // Scroll into view
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function toggleHotel(el) {
  el.querySelector('.arrow').classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

function showNote(idx) {
  const n = DATA.notes[idx];
  if (!n) return;
  const content = document.getElementById('notesContent');
  // Highlight active
  document.querySelectorAll('.tree-note').forEach(el => el.classList.remove('active'));
  const allNotes = document.querySelectorAll('.tree-note');
  if (allNotes[idx]) allNotes[idx].classList.add('active');
  
  content.innerHTML = `
    <div class="note-view-card">
      <div style="margin-bottom:12px;">
        <span class="meta-tag" style="background:#00d4ff22;color:#00d4ff;">🏨 ${n.hotel}</span>
        <span class="meta-tag" style="background:#7b2ff722;color:#b388ff;">${n.cat}</span>
      </div>
      <h2 style="font-size:1.3em;margin-bottom:16px;line-height:1.4;">${n.title}</h2>
      <div class="body-text">${n.body}</div>
      <div class="tags">${n.tags.split(' ').map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
  `;
}

// ===== INIT =====
buildNotesTree();
</script>
</body>
</html>
